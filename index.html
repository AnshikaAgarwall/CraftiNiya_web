    <!-- Fonts. The design system references these by name in tokens.css;
         without these links every heading silently falls back to Georgia.
         Fraunces loads its opsz, SOFT and WONK axes — the wordmark uses all
         three, so dropping any of them flattens the logo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&display=swap"
      rel="stylesheet"
    />
  </head>
